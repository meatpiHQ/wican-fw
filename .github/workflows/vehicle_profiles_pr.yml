name: PR Workflow for Vehicle Profiles

# This workflow runs code that comes with the pull request (npm ci, npm run
# validate, npm run build), and the pull request can come from a fork. So it
# runs on `pull_request`, where a fork gets a read-only token and no secrets.
# Do not move it back to `pull_request_target`: that would run a fork's code
# with a token that can write to this repository.
#
# The comment on the pull request needs a token that can write, so it is posted
# by vehicle_profiles_pr_comment.yml, which starts when this workflow finishes
# and never checks out or runs anything from the pull request. That workflow
# finds this one by its name and the artifact by its name: keep both in step.

on:
  pull_request:
    paths:
      - 'vehicle_profiles/**'
      - '.vehicle_profiles/**'

permissions:
  contents: read

jobs:
  vehicle-profiles-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .vehicle_profiles
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: '.vehicle_profiles/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Validate vehicle profiles
        run: npm run validate

      - name: Merge and format vehicle profiles
        if: success()
        run: |
          npm run build
          npx prettier ../vehicle_profiles.json --write

      - name: Validate merge output
        run: |
          if [ ! -f ../vehicle_profiles.json ]; then
            echo "Error: vehicle_profiles.json was not created"
            exit 1
          fi
          echo "Generated file size: $(wc -c < ../vehicle_profiles.json) bytes"

      - name: Upload merged vehicle profiles
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: vehicle_profiles.json
          path: ${{ github.workspace }}/vehicle_profiles.json
