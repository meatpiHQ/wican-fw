name: PR Workflow for Vehicle Profiles
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'vehicle_profiles/**'
      - '.vehicle_profiles/**'

jobs:
  vehicle-profiles-check:
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .vehicle_profiles
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: '.vehicle_profiles/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Validate vehicle profiles
        run: npm run validate

      - name: Merge and format vehicle profiles
        if: success()
        run: |
          npm run build
          npx prettier ../vehicle_profiles.json --write

      - name: Validate merge output
        run: |
          if [ ! -f ../vehicle_profiles.json ]; then
            echo "Error: vehicle_profiles.json was not created"
            exit 1
          fi
          echo "Generated file size: $(wc -c < ../vehicle_profiles.json) bytes"

      - name: Upload merged vehicle profiles
        id: upload
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: vehicle_profiles.json
          path: ${{ github.workspace }}/vehicle_profiles.json # Relative to the working-directory

  comment-on-pr:
    needs: vehicle-profiles-check
    if: needs.vehicle-profiles-check.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment on PR with testing instructions
        uses: actions/github-script@v8
        env:
          link: '${{ needs.vehicle-profiles-check.outputs.artifact-url }}'
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const message = `✅ Vehicle profiles merged successfully!\n\nPlease download and test the updated [vehicle_profiles.json](${process.env.link}).`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: message
            });
