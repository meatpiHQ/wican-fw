  async function handle(path, opts, full) {

    }
    if (method === "POST" && path === "/api/scripts/check") {
      state.checks++;
      if (!(S.script_engine && S.script_engine.values.enabled)) return J({ ok: false, error: "busy or script_engine disabled" }, 409);
