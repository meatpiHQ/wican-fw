label = "OWON PSU"
desc = "OWON P4305 car-battery sim (15 V HARD ceiling; keep >= 13.2 V when sleep enabled)"
optional = true
doc = "SCPI over RS232. The sleep benches drive it via ${psu.port}."

[config]
port = "COM2016"
baud = 115200

[health]
cmd = "${python} \"${dir}/probe.py\" --port ${port} --baud ${baud}"
timeout_s = 20
