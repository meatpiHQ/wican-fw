[pytest]
; IDF convention: on-target test files are named pytest_<component>.py
python_files = pytest_*.py test_*.py
; HIL scenarios drive real radios and reboots; keep output live and verbose
addopts = -ra
; managed components ship their own pytest files (espressif__mqtt
; examples/tests) that error at collection — never recurse into them
norecursedirs = managed_components build .git
